name: Private experiment boundary
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install flask==3.1.3 pytest==9.1.1
      - run: python -m pytest -q backend/tests/test_security_boundary.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm run build --prefix frontend
      - run: npm audit --prefix frontend
      - run: npm audit
